[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bs-uno-avas"
version = "0.1.0"
description = "Full-system broken-symmetry UHF + UNO-AVAS active spaces for Fe-S clusters (manifest v1 for algorithms/sbd)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pyscf",
]

[project.optional-dependencies]
gpu = ["gpu4pyscf"]

[project.scripts]
bs-uno-avas = "bs_uno_avas.cli:main"

[tool.setuptools]
packages = ["bs_uno_avas"]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
bs_uno_avas = ["data/AOs/*.npy"]
