# [Fe2S2(SCH3)4] model of 5XTD FES O301 (cluster + SCH3 caps, 24 atoms), UHF route.
# PDB: --pdb examples/5XTD_FES_O301_SCH3.pdb (from plugins/bs_uno_avas/).
[structure]

[states.ox]
n_fe3 = 2
[states.red]
